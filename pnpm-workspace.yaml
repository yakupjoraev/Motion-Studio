packages:
  - apps/*
  - packages/*
  - e2e

# Both of these resolve a platform-specific native binary in an install script, so without an entry
# here pnpm skips that script and prints an approval warning on every install.
#
# sharp — an optional dependency of next, and what Next uses to optimise images in a production
# build.
# esbuild — arrives under vite, which Vitest runs the test files through. Without its binary in
# place every `vitest run` fails to start.
# lefthook — its postinstall places the platform binary that `lefthook install` and every hook then
# invoke. Skipped, the `prepare` script fails and the repository silently has no hooks.
# ffmpeg-static — its postinstall downloads the platform ffmpeg the thumbnail generator muxes hover
# clips with (ADR-182). Skipped, `require('ffmpeg-static')` resolves to a path with no file at it.
onlyBuiltDependencies:
  - sharp
  - esbuild
  - lefthook
  - ffmpeg-static
