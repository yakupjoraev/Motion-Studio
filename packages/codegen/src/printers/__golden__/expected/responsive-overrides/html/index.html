<!doctype html>
<html lang="en" data-color-mode="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixture</title>
    <script>
      try {
        var m = localStorage.getItem('ms-color-mode')
        if (m === 'light' || m === 'dark') {
          document.documentElement.dataset.colorMode = m
        }
      } catch (e) {}
    </script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        border: 0 solid;
      }

      * {
        margin: 0;
      }

      html {
        -webkit-text-size-adjust: 100%;
        tab-size: 4;
      }

      body {
        min-height: 100vh;
        font-family: var(--ms-font-sans);
        color: var(--ms-color-foreground);
        background-color: var(--ms-color-surface-0);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      img,
      svg,
      video,
      canvas {
        display: block;
        max-width: 100%;
        height: auto;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
        background: none;
      }

      button {
        cursor: pointer;
      }

      a {
        color: inherit;
        text-decoration: inherit;
      }

      :focus-visible {
        outline: 2px solid var(--ms-color-accent);
        outline-offset: 2px;
      }

      /*
       * Theme: Fixture
       */

      :root {
        --ms-color-surface-0: oklch(98.5% 0.0014 285);
        --ms-color-surface-1: oklch(100% 0 0);
        --ms-color-foreground: oklch(14% 0.0056 285);
        --ms-color-accent: oklch(62% 0.19 285);
        --ms-font-sans: 'Geist Sans', system-ui, sans-serif;
        --ms-font-display: 'Geist Sans', system-ui, sans-serif;
        --ms-font-mono: 'Geist Mono', ui-monospace, monospace;
      }

      :root[data-color-mode='dark'] {
        --ms-color-surface-0: oklch(14% 0.0056 285);
        --ms-color-surface-1: oklch(17.5% 0.007 285);
        --ms-color-foreground: oklch(98.5% 0.0014 285);
        --ms-color-accent: oklch(70% 0.17 285);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-color-mode]) {
          --ms-color-surface-0: oklch(14% 0.0056 285);
          --ms-color-surface-1: oklch(17.5% 0.007 285);
          --ms-color-foreground: oklch(98.5% 0.0014 285);
          --ms-color-accent: oklch(70% 0.17 285);
        }
      }

      /*
       * Fonts: system stack, mode 'reference'. The theme's families are declared in the variables above.
       * To self-host, drop a woff2 beside this file and uncomment the block below.
       *
       * @font-face {
       *   font-family: 'Your Family';
       *   src: url('./your-family.woff2') format('woff2');
       *   font-weight: 400 700;
       *   font-display: swap;
       * }
       */

      .flex {
        display: flex;
      }

      .grid {
        display: grid;
      }

      .grid-cols-1 {
        grid-template-columns: repeat(1, minmax(0, 1fr));
      }

      .flex-col {
        flex-direction: column;
      }

      .gap-4 {
        gap: var(--ms-space-4);
      }

      @media (min-width: 768px) {
        .md\:grid-cols-2 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (min-width: 1024px) {
        .lg\:grid-cols-3 {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .lg\:gap-8 {
          gap: var(--ms-space-8);
        }
      }
    </style>
    <noscript>
      <style>
        .ms-reveal {
          opacity: 1;
          transform: none;
          filter: none;
          clip-path: none;
        }
      </style>
    </noscript>
  </head>
  <body>
    <main class="flex flex-col">
      <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-3 lg:gap-8"></div>
    </main>
  </body>
</html>
