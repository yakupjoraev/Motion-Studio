name: Setup
description: pnpm, Node from .nvmrc, and a frozen install with the pnpm store cached.

# Checkout is not here on purpose: a local composite action cannot run until the repository it lives
# in is already on disk, so every job checks out first and then calls this.
runs:
  using: composite
  steps:
    # Before setup-node, so `cache: pnpm` has a package manager to find a store path for.
    #
    # `dest` keeps the install out of `$HOME`. It was written for the self-hosted runners, which ran
    # as root out of one home directory and collided there (ADR-382); ADR-406 moved the jobs onto
    # GitHub-hosted machines, where `RUNNER_TEMP` is simply the right place for it.
    - uses: pnpm/action-setup@v4
      with:
        dest: ${{ runner.temp }}/setup-pnpm

    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        # A runner is a new machine every job, so the cache is what makes an install fast.
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
