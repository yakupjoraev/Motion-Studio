# DEVOPS.md § Deploy. Vercel, `apps/web`. **Two paths, and they are not the same path** (ADR-373):
#
# - **Preview** — Vercel's own Git integration builds every branch and pull request. Nothing in this
#   file does that any more; the platform is faster at it and, since the repository went private
#   (ADR-372), Actions minutes are billed while Vercel's preview builds are not.
# - **Production** — this workflow, on `main`, and `apps/web/vercel.json` sets
#   `git.deploymentEnabled.main` to `false` so the platform keeps its hands off it. Production goes
#   out after the gates, from the artifact CI built, which is the rule the whole pipeline exists for.
#
# **The app needs no environment variables to run** — no backend, no secrets, no database. The three
# secrets below are Vercel's own credentials for pushing a build, and they are the only ones this
# repository has. If a build ever starts needing an application secret, that is an architectural
# change and belongs in a decision record, not in this file.
#
# Every job is skipped when the credentials are absent, which is the case on a fork's pull request and
# was the case here until the project had a Vercel org: a workflow that fails red for a missing
# secret trains people to ignore red.
name: Deploy

on:
  push:
    branches: [main]
  # Vercel reports its preview builds to GitHub as deployment statuses. This is how the report job
  # learns a preview exists and where it is, now that this workflow no longer creates one.
  deployment_status:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # `vars` rather than `secrets`, because a condition cannot read a secret.
    if: ${{ vars.VERCEL_ENABLED == 'true' && github.event_name != 'deployment_status' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Pull the environment
        run: >
          pnpm dlx vercel@latest pull --yes --environment=production
          --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: pnpm dlx vercel@latest build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: |
          url=$(pnpm dlx vercel@latest deploy --prebuilt --prod \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "### Deployed: ${url}" >> "$GITHUB_STEP_SUMMARY"

  # The two numbers a reviewer would otherwise open two dashboards for, posted on the preview where a
  # regression is still cheap to fix. It runs on Vercel's preview, not on one of ours: `target_url` is
  # the deployment the platform just finished.
  report:
    if: >
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment != 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Lighthouse on the preview
        # `MS_LH_URL` rather than `--url`: the flag leaves `lighthouserc.cjs` free to start a local
        # server, which this job has no build for.
        env:
          MS_LH_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          npx --yes @lhci/cli@0.15.1 collect
          node -e "
            const { readdirSync, readFileSync } = require('node:fs')
            const file = readdirSync('.lighthouseci').find((name) => /^lhr-\d+\.json$/.test(name))
            const report = JSON.parse(readFileSync('.lighthouseci/' + file, 'utf8'))
            const score = (id) => Math.round(report.categories[id].score * 100)
            const line = ['performance', 'accessibility', 'best-practices', 'seo']
              .map((id) => id + ' ' + score(id))
              .join(' · ')
            require('node:fs').writeFileSync('/tmp/lighthouse.txt', line)
            console.log(line)
          "

      - name: The bundle, against the budgets
        # `--silent`, or pnpm's own `> motion-studio@0.0.0 size-limit` banner lands in the file and
        # the comment step dies parsing it. `|| true`, because the gate is `size-limit` in `ci.yml`
        # and here the numbers are a report: the run that broke a budget is the one whose comment is
        # worth reading, and the table has a ❌ column for exactly that row.
        run: pnpm build && (pnpm --silent size-limit --json > /tmp/size.json || true)

      - name: Comment
        uses: actions/github-script@v7
        with:
          script: |
            const { readFileSync } = require('node:fs')

            // A `deployment_status` event carries no pull request, so the branch finds it. No open
            // pull request means a branch pushed on its own: the preview is still built and there is
            // simply nowhere to post, which is not a failure.
            const ref = context.payload.deployment.ref
            const { data: pulls } = await github.rest.pulls.list({
              ...context.repo,
              state: 'open',
              head: `${context.repo.owner}:${ref}`,
            })
            const pull = pulls[0]

            if (pull === undefined) {
              core.info(`No open pull request for ${ref}; the preview has nowhere to be commented on.`)
              return
            }

            const lighthouse = readFileSync('/tmp/lighthouse.txt', 'utf8')
            const sizes = JSON.parse(readFileSync('/tmp/size.json', 'utf8'))
            const rows = sizes
              .map((entry) => {
                const kib = (entry.size / 1024).toFixed(1)
                const limit = (entry.sizeLimit / 1024).toFixed(1)
                return `| ${entry.name} | ${kib} KiB | ${limit} KiB | ${entry.passed ? '✅' : '❌'} |`
              })
              .join('\n')

            const body = [
              `**Preview** ${context.payload.deployment_status.target_url}`,
              '',
              `**Lighthouse** ${lighthouse}`,
              '',
              '| Bundle | Size | Budget | |',
              '| --- | --- | --- | --- |',
              rows,
            ].join('\n')

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: pull.number,
            })
            const mine = comments.find(
              (comment) => comment.user.type === 'Bot' && comment.body.startsWith('**Preview**'),
            )

            // Edited rather than appended: a pull request with nine pushes should carry one comment
            // with the current numbers, not nine with stale ones.
            if (mine) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body })
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pull.number,
                body,
              })
            }
