# DEVOPS.md § Releases. On a tag: prove it, publish it, and attach the two artefacts a reader of the
# release would want — the image and the workshop.
#
# The gates are not repeated here. A tag points at a commit that already went through `ci.yml` on
# `main`, and re-running twenty minutes of end-to-end tests to publish the same tree would make
# releasing something people avoid. What runs is the fast half: lint, types, unit, build.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release, for a re-run after a failed publish
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size-limit

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so the changelog section can be read out of the file at this tag.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: The version, from the tag
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "number=${tag#v}" >> "$GITHUB_OUTPUT"

      # The section for this version only. A release note that repeats the whole changelog is one
      # nobody reads to find out what changed.
      - name: The changelog section
        run: |
          awk -v version="## ${{ steps.version.outputs.number }}" '
            $0 ~ "^"version { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "CHANGELOG.md has no section for ${{ steps.version.outputs.number }}"
            exit 1
          fi
          cat /tmp/notes.md

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.number }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the workshop
        run: pnpm build:storybook

      - uses: actions/upload-artifact@v7
        with:
          name: storybook-${{ steps.version.outputs.number }}
          path: apps/storybook/storybook-static
          retention-days: 90

      - name: The GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Motion Studio ${{ steps.version.outputs.number }}" \
            --notes-file /tmp/notes.md \
            --verify-tag
