# The pipeline from docs/DEVOPS.md § CI, split into what a push waits for and what runs nightly —
# ADR-397. The runners are sequential (three services in one WSL distribution, two disabled), so a
# job costs wall-clock time rather than a core, and four consecutive pushes produced zero complete
# runs before the split.
#
# `core` is one job and not five because five jobs on a sequential runner pay for five installs and
# buy no parallelism. Order inside it follows docs/TESTING.md § CI ordering — cheapest first, so a
# lint error does not wait on a build.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The full pipeline, one click away when a change earns it.
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # Absent on a fork's pull request. Turbo treats empty values as "no remote cache" and builds
  # locally, which is why nothing here is marked required.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  core:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm test:codegen # the golden comparisons, which `test:coverage` does not run
      - run: pnpm check:deps # cycles, direction rules, deep imports, undeclared imports
      # Every block has both thumbnails and a manifest entry, and no thumbnail outlives its block.
      # Presence and consistency only: proving a thumbnail still matches what its block renders needs
      # a browser, so that stays in `pnpm generate:thumbnails --verify`.
      - run: pnpm check:registry
      # The documentation index and the docs site's nav are built from the same frontmatter, so a
      # document added without regenerating the index fails here rather than shipping a nav the
      # index contradicts.
      - run: pnpm check:docs-index
      # Every golden export and every committed document exported from the shipped catalogue, through
      # `tsc`: a codegen change can break compilation without breaking a golden comparison.
      - run: pnpm test:compile
      - run: pnpm build
      # The four route budgets, from the build manifest rather than from a glob — ADR-314. It runs
      # after `pnpm build` because it measures the files that build produced.
      - run: pnpm size-limit
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # A fork's pull request has no token. Coverage reporting is information, not a gate.
          fail_ci_if_error: false

  # Chrome on every push, unsharded: the engine the product is developed against, answering in one
  # job. The other two engines are nightly — see `e2e-engines` below.
  e2e:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # `chrome` is the channel rather than bundled Chromium, for the reason PERFORMANCE.md gives
      # about where the numbers were taken.
      - run: pnpm --filter e2e exec playwright install --with-deps chrome
      - run: pnpm build
      # One worker, so one browser at a time: the VM is capped at 4 cores and 4 GB (`~/.wslconfig`,
      # the owner's call — the machine is for working on), and two workers on four cores is
      # contention rather than parallelism.
      #
      # The directories, with the separator: a bare `export` is a regular expression over the path
      # and matches `visual/export-dialog.spec.ts` as well. The config ignores `visual/**` too — one
      # of the two would do, and both together mean neither can be quietly undone.
      - run: pnpm --filter e2e exec playwright test flows/ editor/ export/ playground/ a11y/ gallery/ --project=chrome --workers=1
      # The trace is the whole point of `retain-on-failure`: a red run with no trace is a re-run.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-chrome
          path: e2e/test-results
          include-hidden-files: true
          retention-days: 7

  # Everything below runs nightly and on demand, never on a push — ADR-397. These are the gates that
  # need a different engine, a container or a second machine, and they are where this repository's
  # cross-machine defects have always been found. What changed is that a commit no longer waits on
  # them.
  #
  # Split by **engine** and then in three, rather than by test count. Playwright's own sharding
  # divides the list evenly and the list is not evenly expensive: the first cut put the WebKit
  # catalogue walk and the accessibility sweep in one shard, which took 16 minutes of testing against
  # the other two's 6 (ADR-336, ADR-338).
  #
  # `perf` is deliberately not here. Those specs need `MS_INSTRUMENT=1` and read frame timings, and
  # ADR-332 measured what a shared runner does to a timing budget: `benchmarkIndex` moved by 27 %
  # inside a single Lighthouse run. A budget is only comparable to itself — ADR-280.
  e2e-engines:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    strategy:
      fail-fast: false
      matrix:
        # firefox and webkit match the flows and the a11y specs only — `playwright.config.ts`.
        project: [firefox, webkit]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter e2e exec playwright install --with-deps ${{ matrix.project }}
      - run: pnpm build
      - run: pnpm --filter e2e exec playwright test flows/ editor/ export/ playground/ a11y/ gallery/ --project=${{ matrix.project }} --shard=${{ matrix.shard }}/3 --workers=1
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.project }}-${{ matrix.shard }}
          path: e2e/test-results
          include-hidden-files: true
          retention-days: 7

  # Non-blocking by design — prompt 10 § Verify. A broken story is worth knowing about, and it is not
  # a reason to stop a commit: the workshop is a development tool, not a shipped surface. `pnpm build`
  # in `core` already covers everything that ships.
  storybook:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build:storybook

  # The image DEVOPS.md § Docker specifies, built and actually run. Three claims are checked here
  # because none of them can be checked anywhere else: that the Dockerfile builds at all, that the
  # image stays under its budget, and that the thing inside it answers.
  docker:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          load: true
          tags: motion-studio:ci
          # The cache the pnpm store mount needs to survive between runs; without it the install
          # layer is cold every time.
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # What the image is made of, printed whether or not it fits: a number over budget is only
      # actionable with the breakdown beside it.
      - name: What is in it
        run: |
          docker run --rm --entrypoint sh motion-studio:ci -c '
            du -sh /app/* 2>/dev/null | sort -h
            echo "--- inside apps ---"
            du -sh /app/apps/web/.next/* /app/apps/web/public 2>/dev/null | sort -h
            echo "--- the ten heaviest traced packages ---"
            du -sh /app/node_modules/.pnpm/* 2>/dev/null | sort -h | tail -10
          '

      - name: Report the size, and fail over budget
        run: |
          bytes=$(docker image inspect motion-studio:ci --format '{{.Size}}')
          mb=$((bytes / 1024 / 1024))
          echo "image: ${mb} MB"
          echo "### Docker image: ${mb} MB (budget 260 MB)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$mb" -gt 260 ]; then
            echo "over the 260 MB budget in DEVOPS.md § Docker — ADR-344 has the composition"
            exit 1
          fi
      - name: Run it and wait for the healthcheck
        run: |
          docker run -d --name web -p 3000:3000 motion-studio:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health > /tmp/health.json; then
              cat /tmp/health.json
              grep -q '"status":"ok"' /tmp/health.json && exit 0
            fi
            sleep 2
          done
          echo 'the container never answered /api/health'
          docker logs web
          exit 1
      - name: The landing page renders from the container
        run: curl -fsS http://localhost:3000/ | grep -q 'Motion Studio'
      - if: always()
        run: docker rm -f web

      # `--profile dev` is a documented entry point, and it was broken from the day it was written
      # because nothing ran it — ADR-345. It is checked here rather than trusted.
      - name: The dev profile serves Storybook
        run: |
          docker compose --profile dev up -d --build storybook
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:6006/index.json > /tmp/index.json; then
              node -e 'const n=Object.keys(require("/tmp/index.json").entries).length;
                       console.log(`storybook entries: ${n}`);
                       process.exit(n > 0 ? 0 : 1)'
              exit $?
            fi
            sleep 3
          done
          echo 'storybook never answered /index.json'
          docker compose --profile dev logs storybook
          exit 1
      - if: always()
        run: docker compose --profile dev down -v

# Lighthouse and the visual suite have their own workflows, both nightly for the same reason
# (ADR-397): `.github/workflows/lighthouse.yml`, `.github/workflows/visual.yml`.
