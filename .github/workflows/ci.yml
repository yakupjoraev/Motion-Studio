# The pipeline from docs/DEVOPS.md § CI, with the jobs whose subjects exist today.
#
# Job order follows docs/TESTING.md § CI ordering — cheapest first, so a lint error does not wait on a
# build. `quality` uses the composite action rather than repeating pnpm/node/install inline as the
# document writes it: the composite is those exact steps, so the pipeline is unchanged and the setup
# lives in one file.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # So a run can be started by hand — which is what a red pipeline needs after the cause is fixed
  # somewhere other than in the code.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Absent on a fork's pull request. Turbo treats empty values as "no remote cache" and builds
  # locally, which is why nothing here is marked required.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm test:codegen # the golden comparisons, which `test:coverage` does not run
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # A fork's pull request has no token. Coverage reporting is information, not a gate.
          fail_ci_if_error: false

  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm check:deps # cycles, direction rules, deep imports, undeclared imports
      # Every block has both thumbnails and a manifest entry, and no thumbnail outlives its block.
      # Presence and consistency only: proving a thumbnail still matches what its block renders needs
      # a browser, so that stays in `pnpm generate:thumbnails --verify`.
      - run: pnpm check:registry
      # The documentation index and the docs site's nav are built from the same frontmatter, so a
      # document added without regenerating the index fails here rather than shipping a nav the
      # index contradicts.
      - run: pnpm check:docs-index

  # Every golden export and every committed document exported from the shipped catalogue, through
  # `tsc`. It runs on every pull request because a codegen change can break compilation without
  # breaking a golden comparison: the output changes, the golden updates, and the result no longer
  # compiles.
  compile-exports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test:compile

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      # The four route budgets, from the build manifest rather than from a glob — ADR-314. It runs
      # after `pnpm build` because it measures the files that build produced.
      - run: pnpm size-limit

  # Non-blocking by design — prompt 10 § Verify. A broken story is worth knowing about on every pull
  # request, and it is not a reason to stop one: the workshop is a development tool, not a shipped
  # surface. `pnpm build` above already covers everything that ships.
  storybook:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build:storybook
  # The flows, the editor, the export targets, the playground and the accessibility suite — 422 specs
  # across three engines.
  #
  # Split by **engine** and then in half, rather than into three by test count. Playwright's own
  # sharding divides the list evenly and the list is not evenly expensive: the first cut put the
  # WebKit catalogue walk and the accessibility sweep in one shard, which took 16 minutes of testing
  # against the other two's 6. One engine per job is a division by cost, and it is also the division
  # a failure is read in — "WebKit is red" is a sentence about a browser.
  #
  # `perf` is deliberately not here. Those specs need `MS_INSTRUMENT=1` and read frame timings, and
  # ADR-332 measured what a shared runner does to a timing budget: `benchmarkIndex` moved by 27 %
  # inside a single Lighthouse run. A budget is only comparable to itself — ADR-280.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # firefox and webkit match the flows and the a11y specs only — `playwright.config.ts`.
        project: [chrome, firefox, webkit]
        # Three parts rather than two — ADR-338: at two, the slowest job took 10.0 minutes against a
        # contract of eight, while its sibling on the same engine finished the tests in 4.2.
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # One engine per job, so one browser per job. `chrome` is the channel rather than bundled
      # Chromium, for the reason PERFORMANCE.md gives about where the numbers were taken.
      - run: pnpm --filter e2e exec playwright install --with-deps ${{ matrix.project }}
      - run: pnpm build
      # Two workers, which the config does not set: `workers: 1` is there for the performance specs,
      # whose numbers are only comparable when nothing else is competing for the machine. This job
      # runs none of them, so the constraint is the runner's cores rather than a measurement.
      # The directories, with the separator: a bare `export` is a regular expression over the path and
      # matches `visual/export-dialog.spec.ts` as well. The config ignores `visual/**` too — one of
      # the two would do, and both together mean neither can be quietly undone.
      - run: pnpm --filter e2e exec playwright test flows/ editor/ export/ playground/ a11y/ --project=${{ matrix.project }} --shard=${{ matrix.shard }}/3 --workers=2
      # The trace is the whole point of `retain-on-failure`: a red shard with no trace is a re-run.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.project }}-${{ matrix.shard }}
          path: e2e/test-results
          include-hidden-files: true
          retention-days: 7

  # The image DEVOPS.md § Docker specifies, built and actually run. Three claims are checked here
  # because none of them can be checked anywhere else: that the Dockerfile builds at all, that the
  # image stays under its budget, and that the thing inside it answers.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          load: true
          tags: motion-studio:ci
          # The cache the pnpm store mount needs to survive between runs; without it the install
          # layer is cold every time.
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # What the image is made of, printed whether or not it fits: a number over budget is only
      # actionable with the breakdown beside it.
      - name: What is in it
        run: |
          docker run --rm --entrypoint sh motion-studio:ci -c '
            du -sh /app/* 2>/dev/null | sort -h
            echo "--- inside apps ---"
            du -sh /app/apps/web/.next/* /app/apps/web/public 2>/dev/null | sort -h
            echo "--- the ten heaviest traced packages ---"
            du -sh /app/node_modules/.pnpm/* 2>/dev/null | sort -h | tail -10
          '

      - name: Report the size, and fail over budget
        run: |
          bytes=$(docker image inspect motion-studio:ci --format '{{.Size}}')
          mb=$((bytes / 1024 / 1024))
          echo "image: ${mb} MB"
          echo "### Docker image: ${mb} MB (budget 180 MB)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$mb" -gt 180 ]; then
            echo "over the 180 MB budget in DEVOPS.md § Docker"
            exit 1
          fi
      - name: Run it and wait for the healthcheck
        run: |
          docker run -d --name web -p 3000:3000 motion-studio:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health > /tmp/health.json; then
              cat /tmp/health.json
              grep -q '"status":"ok"' /tmp/health.json && exit 0
            fi
            sleep 2
          done
          echo 'the container never answered /api/health'
          docker logs web
          exit 1
      - name: The landing page renders from the container
        run: curl -fsS http://localhost:3000/ | grep -q 'Motion Studio'
      - if: always()
        run: docker rm -f web

# Lighthouse has its own workflow — `.github/workflows/lighthouse.yml`, prompt 54.
#
# Jobs still to come, each with the prompt that creates what it tests:
#   visual          — prompt 57, non-blocking, main and labelled pull requests
# Prompt 60 assembles the complete pipeline and reports per-job duration.
