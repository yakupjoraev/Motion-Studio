# DEVOPS.md § Docker. `docker compose up --build` is the whole setup a reader needs: no toolchain, no
# environment file, no database. `--profile dev` adds Storybook, which is a development surface and is
# therefore not in the default profile.
services:
  web:
    build:
      context: .
      target: runner
    image: motion-studio:local
    ports: ['3000:3000']
    healthcheck:
      # The same command the image's own HEALTHCHECK runs, so `docker compose ps` and `docker ps`
      # agree about what healthy means.
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 3s
      start_period: 10s
    restart: unless-stopped

  storybook:
    build:
      context: .
      # Its own stage, not `builder`: Storybook is served from source, and `builder`'s install is
      # pruned to the app. See the stage comment in the Dockerfile.
      target: storybook
    # No `--host`: `dev:storybook` is a turbo task, so a trailing flag is turbo's to parse and it
    # exits on an unknown one. Storybook 8.6 already listens on every interface — measured, the port
    # answers from the host without it.
    command: pnpm dev:storybook
    ports: ['6006:6006']
    profiles: [dev]
