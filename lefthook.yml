# docs/DEVOPS.md § Git hooks. Hooks never run the full suite: a pre-commit hook that takes 40 seconds
# gets bypassed with --no-verify, and then it protects nothing.
pre-commit:
  parallel: true
  commands:
    format:
      # .mjs and .mts are here because the gate scripts are .mjs and Biome lints them like any other
      # source — see docs/DEVOPS.md § Git hooks.
      glob: '*.{ts,tsx,mts,mjs,json,md,css}'
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    secrets:
      run: pnpm check:secrets {staged_files}

# These four are the whole gate while GitHub Actions is unavailable (ADR-374). They are the checks
# that finish in a couple of minutes on a warm cache; e2e, Lighthouse, Docker and the screenshots are
# run by hand — `docs/DEVOPS.md` § When CI cannot run says which command and when.
pre-push:
  commands:
    lint:
      run: pnpm lint
    typecheck:
      run: pnpm typecheck
    unit:
      run: pnpm test:unit
    build:
      run: pnpm build

commit-msg:
  commands:
    conventional:
      run: pnpm check:commit-msg {1}
